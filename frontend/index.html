<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoDocuments</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header class="app-header">
  <div class="app-header__inner">
    <span class="app-header__mark">CoDocuments</span>
    <span class="app-header__tagline">Cogistics document generator</span>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h1 class="panel__title">What would you like to work on?</h1>
    <p class="panel__hint">Choose a service to see its documents.</p>
    <div class="service-grid" id="service-grid"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>
</main>

<script src="services.js?v=3"></script>
<script>
(async () => {
  try {
    renderCards(document.getElementById("service-grid"), await loadServices());
  } catch (err) {
    const status = document.getElementById("status");
    status.className = "status is-error";
    status.textContent = "Couldn't load the list of services. Is the backend running?";
  }
})();
</script>
</body>
</html>
