<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoDocuments</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header__inner">
    <span class="app-header__mark">CoDocuments</span>
    <span class="app-header__tagline">Cogistics document generator</span>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h1 class="panel__title">What would you like to work on?</h1>
    <p class="panel__hint">Choose a service to see its documents.</p>
    <div class="service-grid" id="service-grid"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>
</main>

<script>
// The cards come from services.json — to add a service or move a tool, edit that
// file; this page doesn't change. Text is set with textContent, never innerHTML.
(async () => {
  const grid = document.getElementById("service-grid");
  const status = document.getElementById("status");
  try {
    const res = await fetch("services.json");
    if (!res.ok) throw new Error(res.status);
    const { services } = await res.json();
    for (const s of services) {
      const a = document.createElement("a");
      a.className = "service-card";
      a.href = s.href;
      const name = document.createElement("h2");
      name.className = "service-card__name";
      name.textContent = s.name;
      const desc = document.createElement("p");
      desc.className = "service-card__desc";
      desc.textContent = s.description;
      a.append(name, desc);
      grid.appendChild(a);
    }
  } catch (err) {
    status.className = "status is-error";
    status.textContent = "Couldn't load the list of services. Is the backend running?";
  }
})();
</script>
</body>
</html>
